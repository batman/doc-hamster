name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: pdo_mysql, mbstring, intl, sodium, fileinfo, exif, zip, gd
  # Minimum limits from D-010, so `dochamster:doctor` sees a compliant server.
  PHP_INI: memory_limit=512M, upload_max_filesize=32M, post_max_size=32M

jobs:
  quality:
    name: Lint, static analysis, licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: PHPStan level 8 (PLAN §13)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: License allowlist (D-022)
        run: php scripts/check-licenses.php
      - name: Known vulnerabilities
        run: composer audit

  tests:
    name: Tests on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # D-003: both databases from v1, at their minimum LTS versions.
          - name: MariaDB 10.11
            connection: mariadb
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.4
            connection: mysql
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1
    services:
      database:
        image: ${{ matrix.image }}
        # Throwaway CI container: no password at all, so none lives in the repo.
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: dochamster
          MARIADB_DATABASE: dochamster
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dochamster
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI }}
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrations up, down, up
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Environment check against the real database (D-010)
        run: php artisan dochamster:doctor

      - name: Tests (unit, feature, arch)
        run: vendor/bin/pest

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
