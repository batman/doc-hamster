name: Preview package

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  # A335: the working branch dev is always a preview of its own, without a pull request. It uses the reserved
  # number 1000000 (no pull request ever gets it), so the installer and the Update page treat it like any preview.
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number || 'dev' }}
  cancel-in-progress: true

env:
  DEV_PREVIEW: 1000000

jobs:
  package:
    if: >-
      github.event_name == 'push' || (
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref != 'dev' &&
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'preview-ready'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      number: ${{ steps.package.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, sodium, fileinfo, exif, zip, gd
          coverage: none
          tools: composer:v2

      - name: Build preview package
        id: package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || env.DEV_PREVIEW }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION="preview-${PR_NUMBER}-${COMMIT_SHA:0:7}"
          TAG="preview-pr-${PR_NUMBER}"
          mkdir -p build
          git archive HEAD | tar -x -C build --one-top-level=dochamster
          cd build/dochamster
          rm -rf tests .github .githooks docs scripts installer phpunit.xml phpstan.neon pint.json .gitleaks.toml AGENTS.md CLAUDE.md
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          echo "$VERSION" > VERSION
          cd ..
          zip -qr dochamster-preview.zip dochamster
          SHA=$(sha256sum dochamster-preview.zip | cut -d' ' -f1)
          PHP_MIN=$(php -r '$c=json_decode(file_get_contents("dochamster/composer.json"),true); preg_match("/(\d+\.\d+)/",$c["require"]["php"],$m); echo $m[1].".0";')
          sed -e "s/const DH_INSTALLER_VERSION = 'dev';/const DH_INSTALLER_VERSION = '${VERSION}';/" \
              -e "s/const DH_PREVIEW_PR = 0;/const DH_PREVIEW_PR = ${PR_NUMBER};/" \
              -e "s/const DH_PREVIEW_SHA = '';/const DH_PREVIEW_SHA = '${COMMIT_SHA}';/" \
              ../installer/install.php > install.php
          grep -q "DH_PREVIEW_PR = ${PR_NUMBER}" install.php
          INSTALLER_SHA=$(sha256sum install.php | cut -d' ' -f1)
          printf '{"version":"%s","php":"%s","zip":"dochamster-preview.zip","sha256":"%s","installer_sha256":"%s","pr":%s,"commit_sha":"%s"}\n' \
            "$VERSION" "$PHP_MIN" "$SHA" "$INSTALLER_SHA" "$PR_NUMBER" "$COMMIT_SHA" > manifest.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number || env.DEV_PREVIEW }}
          path: |
            build/dochamster-preview.zip
            build/manifest.json
            build/install.php
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: needs.package.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-${{ github.event.pull_request.number || env.DEV_PREVIEW }}
          path: preview

      - name: Replace preview release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.package.outputs.number }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          TITLE="DocHamster preview PR #${PR_NUMBER}"; [ "$PR_NUMBER" = "$DEV_PREVIEW" ] && TITLE="DocHamster preview dev"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --prerelease \
            --notes "Preview package for the open PR. Do not use as a production release." \
            preview/dochamster-preview.zip preview/manifest.json preview/install.php

  remove:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref != 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview-ready'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete preview release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh release delete "preview-pr-${PR_NUMBER}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

  # The Update page and the preview installer read only this file (A87): plain downloads have no
  # rate limit, the GitHub API allows an anonymous server just 60 calls an hour.
  list:
    needs: [package, publish, remove]
    if: >-
      always() && !cancelled() &&
      (needs.publish.result == 'success' || needs.remove.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: preview-list
      cancel-in-progress: false
    steps:
      - name: Rebuild previews.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          gh api "repos/$R/pulls?state=open&base=main&per_page=100" --paginate \
            --jq ".[] | select(.draft | not) | select(.head.repo.full_name == \"$R\") | select([.labels[].name] | index(\"preview-ready\")) | {number, title, branch: .head.ref, sha: .head.sha, date: .updated_at}" > open.jsonl
          : > listed.jsonl
          while IFS= read -r pr; do
            n=$(jq -r .number <<<"$pr"); sha=$(jq -r .sha <<<"$pr")
            built=$(gh release download "preview-pr-$n" --repo "$R" -p manifest.json -O - 2>/dev/null | jq -r '.commit_sha // empty' || true)
            # Only a package built from the branch's current commit is offered.
            if [ "$built" = "$sha" ]; then echo "$pr" >> listed.jsonl; fi
          done < open.jsonl
          # A335: the working branch dev, when its package is built from its current commit.
          dev=$(gh api "repos/$R/branches/dev" --jq '{sha: .commit.sha, date: .commit.commit.committer.date}' 2>/dev/null || true)
          if [ -n "$dev" ]; then
            devsha=$(jq -r .sha <<<"$dev")
            built=$(gh release download "preview-pr-$DEV_PREVIEW" --repo "$R" -p manifest.json -O - 2>/dev/null | jq -r '.commit_sha // empty' || true)
            if [ "$built" = "$devsha" ]; then
              jq -c --argjson n "$DEV_PREVIEW" '{number: $n, title: "Arbeitsstand", branch: "dev", sha: .sha, date: .date}' <<<"$dev" >> listed.jsonl
            fi
          fi
          jq -s 'sort_by(.number)' listed.jsonl > previews.json
          cat previews.json
          gh release view previews --repo "$R" >/dev/null 2>&1 || gh release create previews --repo "$R" --prerelease \
            --title "DocHamster previews" --notes "List of branches open for preview, read by the Update page. Not a release."
          gh release upload previews previews.json --repo "$R" --clobber
