# Secret scanning (AGENTS.md, public repository rules). Used by the
# pre-commit hook in .githooks/ and by CI.
title = "DocHamster gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Third-party code, never committed. Generated caches and storage/ are NOT allowlisted: they are git-ignored, and if one is ever tracked it must be scanned."
paths = [
    '''^vendor/''',
    '''^node_modules/''',
]
